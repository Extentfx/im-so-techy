name = "life-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Static app is served by Cloudflare Pages; this Worker owns /api/*.
# Route is attached once the domain exists, e.g. life.example.com/api/*

[vars]
# Fill in after creating the Access application (Zero Trust > Access > Applications).
ACCESS_TEAM_DOMAIN = ""   # e.g. https://yourteam.cloudflareaccess.com
ACCESS_AUD = ""           # Application Audience (AUD) tag
ALLOWED_EMAIL = ""        # the single owner
# Optional: Access service-token client IDs (comma separated) allowed to POST /api/ingest/* only,
# for an iOS Shortcut or wearable that posts sleep data. Everything else rejects them.
ALLOWED_SERVICE_TOKENS = ""
# Optional: daily Claude spend cap in US dollars (chat stops and falls back to built-in answers).
CHAT_DAILY_CAP_USD = "1"
# The public address of the app, so sign-in redirects are exact, e.g. "https://life.example.com".
PUBLIC_URL = ""
# Microsoft tenant: "common" allows personal and work accounts.
MS_TENANT = "common"

# Every 15 minutes: refresh calendar feeds, re-plan, run enabled home routines and bedtime
# reminders, and (once a day) store an encrypted backup if R2 is bound.
[triggers]
crons = ["*/15 * * * *"]

# Secrets (never in this file). Each: `npx wrangler secret put NAME`
#   TOKEN_KEY          required. `openssl rand -base64 32`. Encrypts calendar links, the Home Assistant token and backups.
#   ANTHROPIC_API_KEY  optional. Turns on Claude for chat and email labelling.
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET   optional. Gmail (read-only) and Google Calendar sign-in (see the README).
#   MS_CLIENT_ID / MS_CLIENT_SECRET           optional. Outlook mail (read-only) and calendar sign-in.
#   FDC_API_KEY        optional. A free USDA FoodData Central key (otherwise a shared, rate-limited demo key is used).
#   BACKUP_KEY         optional. A separate key for backups (defaults to TOKEN_KEY).

# Create with: npx wrangler d1 create life-db   then paste the id here
[[d1_databases]]
binding = "DB"
database_name = "life-db"
database_id = "REPLACE_ME"
migrations_dir = "migrations"

# Optional: nightly encrypted backups, kept for two weeks.
# Create with: npx wrangler r2 bucket create life-backups   then uncomment:
# [[r2_buckets]]
# binding = "BACKUPS"
# bucket_name = "life-backups"
